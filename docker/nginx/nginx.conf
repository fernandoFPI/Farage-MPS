events {
    worker_connections 1024;
}

http {
    upstream backend {
        server mps-backend:3000;
    }

    upstream frontend {
        server mps-frontend:80;
    }

    server {
        listen 80;
        server_name mps.farage.com www.mps.farage.com;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name mps.farage.com www.mps.farage.com;

        ssl_certificate     /etc/letsencrypt/live/mps.farage.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/mps.farage.com/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        client_max_body_size 50M;

        location /api {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 300s;
        }

        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
